; Physical constants used by Pandora (one place for the whole package; read once at import).
; Changing a value changes the model; the numba cache is cleared automatically (pandoramoon/_config.py).

[physics]
; gravitational constant [m^3 kg^-1 s^-2], CODATA 2014 (Pandora's model value since its first version;
; CODATA 2018: 6.67430e-11)
G = 6.67408e-11
; seconds per day
day = 86400.0
; solar radius [m] (Emilio et al. 2012; used for R_star in examples and default priors)
R_sun = 696342000.0
; solar mass [kg] (IAU 2015 nominal GM_sun / G)
M_sun = 1.98847e30
; Jupiter mass [kg] (IAU 2015 nominal GM_jup / G)
M_jup = 1.89813e27
