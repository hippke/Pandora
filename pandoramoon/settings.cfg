; Pandora's default settings and tuning values (read once at import; plain Python, no effect on speed).
; Values in [fit_rules], [fit] and [detect] were calibrated and validated together (SAMPLING.md in the development
; repository): change them only with a new validation. A change clears the numba cache once (cache guard).

[model]
; moons beyond this fraction of the planet's Hill radius are unphysical (planet-only model); model_params and
; Likelihood default
hill_sphere_threshold = 1.0
; moons with r_moon below this use the small-body approximation (0: exact Mandel-Agol for every moon)
occult_small_threshold = 0.0

[supersampling]
; NestedSampler(supersampling="auto"): a likelihood with this cadence [min] or longer is supersampled ...
auto_min_cadence_min = 10.0
; ... with this many sub-exposures per cadence (30-min data: >= 5 for unbiased Bayes factors; SAMPLING.md Round 16)
auto_factor = 5

[fit]
; accuracy presets of nss.fit / NestedSampler.run(accuracy=...): live points per run, lnZ error target,
; posterior KS target, minimum runs (SAMPLING.md Round 12)
high_nlive = 1000
high_lz_tol = 0.1
high_ks_tol = 0.05
high_min_runs = 16
; NestedSampler.run's default accuracy (since Pandora 2.0: medium; use high for evidence comparisons at 0.1-0.3 nats)
default_accuracy = medium
medium_nlive = 500
medium_lz_tol = 0.2
medium_ks_tol = 0.08
medium_min_runs = 8
; maximum number of runs of the result arm (then passed=False)
max_runs = 96
; initial chain length nsteps = nsteps_per_dim x (number of sampled coordinates); cap max_nsteps_per_dim x
nsteps_per_dim = 4
max_nsteps_per_dim = 64
; n_live escalation cap: max_nlive_factor x the initial n_live
max_nlive_factor = 4
; rejection init: at least this many prior draws to measure the volume above the LOGZERO plateau
init_min_draws = 100000

[planet_is]
; planet-only evidence by importance sampling (2026-10-14; NestedSampler(planet_evidence="is"), the default). The
; planet-only posterior is unimodal: one nested-sampling run (pilot) gives its shape, importance sampling with a
; Student-t proposal gives lnZ (benchmark D1: -139.068 +- 0.025 vs the full fit -139.055 +- 0.028 at 1/80 the CPU)
; pilot: pilot_runs independent runs of pilot_nlive live points in parallel threads (the serial sampler shared with
; the fits; a run with k > 1 parallel chains would need its own numba compilation, ~35 s per process), merged
pilot_runs = 4
pilot_nlive = 100
; proposal: a mixture of Student-t kernels (df degrees of freedom, shape bandwidth^2 x the posterior covariance)
; around kde_centres points drawn from the pilot posterior, plus a defensive fraction of one Student-t with the
; posterior covariance x scale^2 (tails). A single Student-t gave effective sample sizes of 0.2-7 % on the notebook
; data (curved a / b posterior, prior edges); the mixture 7-16 % on all 5 pilot seeds (2026-10-14).
; n_draws draws, doubled up to n_max until the lnZ error <= error_frac x lz_tol
df = 4
scale = 1.5
kde_centres = 400
kde_bandwidth = 0.5
defensive = 0.1
n_draws = 50000
n_max = 400000
error_frac = 0.33
; checks (else the full nested-sampling fit): effective sample size >= ess_min, the largest weight <= max_share of
; the total, IS and pilot lnZ within consistency_k x their combined error + 0.1
ess_min = 300
max_share = 0.05
consistency_k = 4.0

[fit_rules]
; The four decision rules of nss.fit() (NSS_SAMPLER.md "Outer level"):
;   1 done?            lnZ error <= lz_tol, split-half KS <= ks_tol, >= min_runs runs, rule 2 passed,
;                      at most failed_max of the runs failed
;   2 chains long?     the arms at N and N / 2 agree (dlnZ, KS with a permutation null); else nsteps x 2
;   3 excess scatter?  per-run lnZ sd > scatter_ratio x quoted: nsteps x 2 if the N / 2 arm scatters more, else n_live x 2
;   4 better solution? a gap in the runs' lnZ with a higher maxL above it: n_live x 2
; Once rule 3 / 4 sent a fit to more live points, nsteps is never doubled again.
; min runs per arm before an arm statistic is used (also max(4, min_runs / 2))
runs_gate = 4
; rule 2 pass: |dlnZ| + sigma <= 2 lz_tol (Round 8, known-Z tests: bias(N) <~ dlnZ(N/2, N))
bias_pass = 2.0
; rule 2 escalate, imprecise tier: |dlnZ| - k sigma > 2 lz_tol (Round 16) ...
bias_esc = 2.0
; ... with k = 2 ...
k_sig = 2.0
; ... or 3 while an arm has < min_runs runs (the sd from few runs is unreliable; Round 16)
k_sig_few = 3.0
; rule 2 escalate, precise tier (result arm converged, sigma <= 0.6 lz_tol): |dlnZ| - sigma > 1 lz_tol
; (Round 16; one threshold cannot serve both tiers: Round 23 pool scan)
precise_sigma = 0.6
precise_esc = 1.0
; rule 2 KS escalation on the median null only with >= 2 min_runs runs per arm (Round 16)
ks_runs = 2
; rule 3: normal per-run scatter 1.1-2.1 x quoted at nsteps 64 (67 pools); 0 % false triggers at 32 runs (Round 21)
scatter_ratio = 2.75
; rule 3 needs >= max(16, 2 min_runs) runs (heavy-tailed sd of few runs; Round 16)
scatter_runs_min = 16
scatter_runs_x = 2
; rule 3 routing: the N / 2 arm scatters >= 1.25 x more -> nsteps (Round 18)
scatter_falls = 1.25
; rule 4: gap > max(6 x quoted, 2 nats); normal pools: largest 3.2 x / 0.81 nats (Round 21)
gap_quoted = 6.0
gap_nats = 2.0
; rule 4: median maxL above the gap > 2 nats higher than below it
gap_maxl = 2.0
; failed run: maxL > 5 below the best AND lnZ > max(5 MAD, 2) below the median (Round 6b)
failed_dl = 5.0
failed_mad = 5.0
failed_dz = 2.0
; more failed runs than 10 %: not passed
failed_max = 0.1
; stalled stop (Round 23): no escalation possible any more -> stop once the lnZ error <= lz_tol and at least
; stall_runs_x x min_runs runs (the run scatter of a multimodal fit is heavy-tailed: an error from ~min_runs runs is
; unreliable; 16-d two-mode test: stop after 9 runs at -0.60 +- 0.19 vs truth 0)
stall_runs_x = 2

[detect]
; detect(): the first look. Per recall preset (fraction of well-detectable moons found, SAMPLING.md Round 12):
; "nlive_moon nsteps_moon repeats" of the planet+moon runs
recall_0.90 = 50 8 1
recall_0.95 = 50 8 2
recall_0.99 = 50 16 3
recall_0.999 = 50 16 6
; the planet-only run: live points, chain length
nlive_planet = 50
nsteps_planet = 12
; candidate threshold on dlnZ (white-noise calibration with default_priors-like priors)
threshold = 3.0
; a moon run more than retry_below below the planet run collapsed: up to retry_max extra moon runs
retry_below = -15.0
retry_max = 2
; epoch jackknife: Delta chi^2 without the strongest transit must reach jack_min. Adopted in Round 23 (SAMPLING.md):
; real Kepler moons >= 32 (24 / 25), no-moon controls and planet-only systems <= 26.2 (70); any cut in 10 ... 30 gives
; the same result there; with dlnZ > 3: 0 / 50 control false positives (dlnZ alone: 2 / 50, one star)
jack_min = 18.0

[checks]
; NestedSampler / detect warnings: posterior mass > edge_mass within the outer edge_frac of a prior range of a/R*, r_p,
; P or the t0 offset (planet), or at the upper edge of r_moon / M_moon (moon): the prior excludes what the data
; prefer, or the moon model repairs a misfit of the planet model (2026-10-14)
edge_frac = 0.02
edge_mass = 0.1

[prepare]
; prepare_lightcurve(): transit mask and wotan window in units of T14 (detrending study: best mask 1.0 / window 4.0)
mask = 1.0
window = 4.0
method = biweight
; noise from the detrended data noise_gap ... noise_gap + noise_span T14 beyond the fit windows ...
noise_gap = 1.0
noise_span = 10.0
; ... red-noise factor beta on bins of T14 / beta_bins_per_t14
beta_bins_per_t14 = 4
; warn if beta > beta_warn: flux_err = sigma x beta lowers a moon's dlnZ by ~beta^2 (Kepler tests, SAMPLING.md Round 23:
; beta 3.78 took one injected moon from dlnZ 129 with white errors to -0.8; beta of the other 24 moons' stars <= 2.2)
beta_warn = 2.0

[priors]
; default_priors(): planet priors around the given values ...
per_bary_err_sigmas = 5.0
per_bary_min_frac = 0.002
; a_bary: log-uniform over [a_bary_lo, a_bary_hi] x Kepler's law (2026-10-14; was +-2.3 %). Covers stellar density
; errors of +-2x (a ~ rho^1/3) and eccentric orbits up to e ~ 0.5 (duration factor 0.6-1.7). The narrow prior forced
; wrong transit durations on the planet-only model when the catalogue star or a circular orbit was wrong, and the moon
; model repaired them (Kepler-747 b: dlnZ ~ +1800).
; Validated on 290 white-noise and 50 Kepler light curves (SAMPLING.md "a/R* prior"); a prior centred on a planet-only
; fit was tested and rejected (a moon biases the planet-only a/R* low, the moon fit then hits the prior edge).
a_bary_lo = 0.4
a_bary_hi = 2.5
r_planet_lo = 0.5
r_planet_hi = 1.5
R_star_lo = 0.8
R_star_hi = 1.2
M_planet_lo = 0.5
M_planet_hi = 1.5
t0_halfwidth = 0.05
; ... and moon priors: r_moon in [lo, hi] x r_planet, per_moon up to per_moon_hill x per_bary (the period at the
; planet's Hill radius), M_moon up to M_moon_max x M_planet
r_moon_lo = 0.1
r_moon_hi = 0.7
per_moon_hill = 0.19
M_moon_max = 0.5
